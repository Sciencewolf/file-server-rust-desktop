[package]
name = "file-server-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
dirs = "7.0.0"
dotenvy = "0.15.7"
futures-util = "0.3.34"
mime_guess = "2.0.5"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.20"
